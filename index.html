<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f2740">
<title>🏗️ Excavator Pro — real levers!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#0f2740;overflow:hidden;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;
       display:flex;justify-content:center;align-items:center}
  #stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;max-width:100vw}
  #stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:5}
  #task{position:absolute;top:calc(6px + env(safe-area-inset-top));left:8px;background:rgba(255,255,255,.94);
        border:3px solid #17395c;border-radius:14px;padding:5px 10px}
  #task .big{font-weight:800;font-size:.92rem}
  #task .sub{font-size:.74rem;font-weight:700;color:#3f6a94;margin-top:1px}
  #steps{position:absolute;top:calc(6px + env(safe-area-inset-top));right:8px;display:flex;gap:4px}
  .schip{background:#fff;border:2.5px solid #17395c;border-radius:999px;padding:3px 8px;
         font-size:.68rem;font-weight:900;color:#17395c;opacity:.55}
  .schip.on{background:#ffd166;opacity:1;box-shadow:0 0 0 3px rgba(255,209,102,.45)}
  #snd{position:absolute;top:calc(48px + env(safe-area-inset-top));right:8px;pointer-events:auto;
       font-family:inherit;font-weight:800;border:2.5px solid #17395c;background:#fff;border-radius:11px;
       padding:4px 8px;font-size:.85rem;cursor:pointer}
  #tutCard{position:absolute;left:50%;transform:translateX(-50%);
           bottom:calc(var(--console-h,196px) + 8px + env(safe-area-inset-bottom));
           background:#fff;border:4px solid #ff9f1c;border-radius:18px;padding:8px 16px;
           max-width:92%;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:8}
  #tutCard .ico{font-size:1.7rem;line-height:1.1}
  #tutCard .txt{font-size:.92rem;font-weight:800;color:#17395c;line-height:1.3;margin-top:2px}
  #tutCard .txt b{color:#e63946}
  .ov{position:absolute;inset:0;background:rgba(15,39,64,.66);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
  .ov.show{display:flex}
  .card{background:#fff;border:4px solid #17395c;border-radius:22px;max-width:340px;width:100%;padding:18px 18px 20px;text-align:center}
  .card h1{margin:0 0 8px;font-size:1.3rem}
  .card p{margin:6px 0;font-size:.9rem;line-height:1.45;text-align:left;font-weight:700;color:#17395c}
  .card .stars{font-size:1.7rem;margin:6px 0}
  .card button{font-family:inherit;font-weight:800;font-size:1.1rem;border:3px solid #17395c;border-radius:16px;
               background:#ff8c42;color:#17395c;padding:11px 24px;cursor:pointer;box-shadow:0 5px 0 #b35617;margin-top:10px}
  .card button:active{transform:translateY(3px);box-shadow:0 2px 0 #b35617}

  /* ---------- lever console (DOM) ---------- */
  #console{position:absolute;left:0;right:0;bottom:0;z-index:10;pointer-events:auto;
           height:calc(196px + env(safe-area-inset-bottom));
           background:linear-gradient(180deg,#2c4a6e 0%,#17395c 30%,#0f2740 100%);
           border-top:4px solid #ffd166;
           display:flex;flex-direction:column;gap:4px;padding:8px 10px}
  #swingRow{display:flex;justify-content:center}
  .hlever{width:100%;max-width:340px;position:relative;display:flex;flex-direction:column;align-items:center;
          touch-action:none;cursor:grab}
  .hlever .hslot{width:100%;height:40px;position:relative;border-radius:20px;
                 background:linear-gradient(180deg,#0b1c30,#12314f);border:2px solid #3f6a94;
                 box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
  .hlever .hknob{position:absolute;top:50%;width:54px;height:54px;border-radius:50%;
                 transform:translate(-50%,-50%);left:50%;
                 transition:left .22s cubic-bezier(.2,.9,.3,1.3);
                 display:flex;align-items:center;justify-content:center;
                 font-size:24px;color:#17395c;font-weight:900;
                 background:linear-gradient(180deg,#cdb4f4,#a06cd5);
                 box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 -6px 0 rgba(0,0,0,.22), inset 0 4px 0 rgba(255,255,255,.35);
                 border:3px solid #0b1c30}
  .hlever.hold .hknob{transition:none}
  .hlever .hslot::before{content:'◀';position:absolute;left:6px;top:50%;transform:translateY(-50%);
                         color:#7fa7c9;font-size:10px}
  .hlever .hslot::after{content:'▶';position:absolute;right:6px;top:50%;transform:translateY(-50%);
                        color:#7fa7c9;font-size:10px}
  .hlever .hmid{position:absolute;left:50%;top:50%;width:4px;height:22px;transform:translate(-50%,-50%);
                background:#3f6a94;border-radius:2px}
  .hlever label{font-size:.72rem;font-weight:900;color:#cfe8ff;letter-spacing:1px;padding-top:3px}
  #vRow{flex:1;display:flex;gap:4px}
  .lever{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
         touch-action:none;cursor:grab}
  .lever .slot{flex:1;width:26px;position:relative;border-radius:13px;
               background:linear-gradient(180deg,#0b1c30,#12314f);border:2px solid #3f6a94;
               box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
  .lever .knob{position:absolute;left:50%;top:50%;width:58px;height:44px;border-radius:14px;
               transform:translate(-50%,-50%);
               transition:top .22s cubic-bezier(.2,.9,.3,1.3);
               display:flex;align-items:center;justify-content:center;
               font-size:22px;color:#17395c;font-weight:900;
               box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 -6px 0 rgba(0,0,0,.22), inset 0 4px 0 rgba(255,255,255,.35);
               border:3px solid #0b1c30}
  .lever.hold .knob{transition:none}
  .lever .slot::before{content:'▲';position:absolute;top:1px;left:50%;transform:translateX(-50%);
                       color:#7fa7c9;font-size:10px;z-index:1}
  .lever .slot::after{content:'▼';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
                      color:#7fa7c9;font-size:10px;z-index:1}
  .lever[data-id="boom"]  .knob{background:linear-gradient(180deg,#ffc46b,#ff8c42)}
  .lever[data-id="stick"] .knob{background:linear-gradient(180deg,#7fd8d0,#2fa7a0)}
  .lever[data-id="buck"]  .knob{background:linear-gradient(180deg,#ff9b9b,#e63946)}
  .lever label{font-size:.72rem;font-weight:900;color:#cfe8ff;letter-spacing:1px;padding:3px 0 1px}
  .lever .mid{position:absolute;left:50%;top:50%;width:34px;height:4px;transform:translate(-50%,-50%);
              background:#3f6a94;border-radius:2px}
  .locked{opacity:.28;pointer-events:none}
  .glowt .knob,.glowt .hknob{animation:kpulse .7s ease-in-out infinite}
  @keyframes kpulse{0%,100%{box-shadow:0 0 0 3px rgba(255,209,102,.9),0 4px 10px rgba(0,0,0,.5)}
                    50%{box-shadow:0 0 0 10px rgba(255,209,102,.25),0 4px 10px rgba(0,0,0,.5)}}
  #failNet{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;
           font-size:1rem;font-weight:700;z-index:40;background:#0f2740;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="stage">
  <div id="failNet">🌐 Loading the digger…</div>
  <div id="ui">
    <div id="task">
      <div class="big">🪣 Buckets: <span id="loadTxt">0 / 1</span></div>
      <div class="sub">⏱ <span id="timeTxt">—</span> · ⭐ level <span id="lvlTxt">1</span></div>
    </div>
    <div id="steps">
      <span class="schip" id="chipDig">1 DIG</span>
      <span class="schip" id="chipSwing">2 SWING</span>
      <span class="schip" id="chipDump">3 DUMP</span>
    </div>
    <button id="snd">🔊</button>
    <div id="tutCard" style="display:none">
      <div class="ico" id="tutIco">👋</div>
      <div class="txt" id="tutTxt"></div>
    </div>
  </div>

  <div id="console">
    <div id="swingRow">
      <div class="hlever" data-id="swing"><div class="hslot"><div class="hmid"></div><div class="hknob">⇄</div></div><label>SWING — turn the cab ◀ ▶</label></div>
    </div>
    <div id="vRow">
      <div class="lever" data-id="boom"><div class="slot"><div class="mid"></div><div class="knob">⇕</div></div><label>BOOM ⬆⬇</label></div>
      <div class="lever" data-id="stick"><div class="slot"><div class="mid"></div><div class="knob">⇔</div></div><label>STICK ⬆⬇</label></div>
      <div class="lever" data-id="buck"><div class="slot"><div class="mid"></div><div class="knob">🥄</div></div><label>BUCKET ⬇scoop ⬆dump</label></div>
    </div>
  </div>

  <div class="ov show" id="startOv">
    <div class="card">
      <h1>🏗️ YOUR DIGGER!</h1>
      <p>🦾 It has <b>4 motors</b> — you will learn them <b>one at a time</b>. Follow the yellow coach!</p>
      <p>🪣 The plan is always 3 steps: <b>1 DIG</b> → <b>2 SWING</b> → <b>3 DUMP</b> into the truck!</p>
      <button id="btnStart">▶ START THE ENGINE</button>
    </div>
  </div>
  <div class="ov" id="lvlOv">
    <div class="card">
      <h1 id="lvlTitle">🚛 TRUCK LOADED!</h1>
      <div class="stars" id="starTxt">⭐⭐⭐</div>
      <p id="lvlText" style="text-align:center"></p>
      <button id="btnGo">▶ NEXT SHIFT</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
window.__errs=[];
window.onerror=function(m,s,l,c){window.__errs.push(m+' @'+l);};
if(!window.PIXI){
  const f=document.getElementById('failNet');
  f.style.display='flex';
  f.textContent='⚠️ Could not load the 3D engine — check your internet and refresh.';
  return;
}
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const R=Math.random;
const TAU=Math.PI*2, D2R=Math.PI/180;

/* ================= PIXI setup ================= */
const stage=$('stage');
const app=new PIXI.Application({resizeTo:stage,antialias:true,backgroundColor:0x5fb2f0,
  resolution:Math.min(2,window.devicePixelRatio||1),autoDensity:true});
stage.insertBefore(app.view,stage.firstChild);
$('failNet').style.display='none';

const CONSOLE_H=()=>document.getElementById('console').offsetHeight;
let VH=stage.clientHeight, VW=stage.clientWidth, SC=1, DW=420;
function relayout(){
  VH=stage.clientHeight;VW=stage.clientWidth;
  SC=(VH-CONSOLE_H())/620;
  DW=VW/SC;
  root.scale.set(SC);
  document.documentElement.style.setProperty('--console-h',CONSOLE_H()+'px');
  layoutScene();
}
const root=new PIXI.Container();
app.stage.addChild(root);
const layerBack=new PIXI.Container(), layerMid=new PIXI.Container(), layerFront=new PIXI.Container();
root.addChild(layerBack,layerMid,layerFront);

/* ================= constants/state ================= */
const GY=555;
const DX=()=>DW*0.46;
const TRUCK={off:-135,bedOff:-110};
const FACE={off:215,base:160,cols:10};
const RATE={boom:110,stick:120,buck:165,swing:150};
const S={started:false,paused:false,sound:true,level:1,loads:0,need:6,time:0,par:150,tutorial:true};
const D={swing:-14,e1:30,e2:40,e3:10,fill:0,carry:false};
const LV=[
  {id:'boom', v:0,active:false,enabled:false},
  {id:'stick',v:0,active:false,enabled:false},
  {id:'buck', v:0,active:false,enabled:false},
  {id:'swing',v:0,active:false,enabled:false},
];
let cols=[],pileH=8;
const truck={x:0,arriving:false,leaving:false};
let parts=[],zone={i:1,w:3};
let starCount=3,tutStep=-1,tutCelebrate=0,graduating=false;

/* ================= geometry ================= */
function arm3D(){
  const t=D.swing*D2R,e1=D.e1*D2R,e12=(D.e1+D.e2)*D2R,e123=(D.e1+D.e2+D.e3)*D2R;
  const L1=140,L2=106,LB=56;
  const cf=0.55+0.45*Math.abs(Math.cos(t));
  const cs=Math.cos(t)*cf;
  const sh={x:DX()+Math.cos(t)*24,y:GY-66};
  const eB={hx:Math.cos(e1)*L1,vy:Math.sin(e1)*L1};
  const eS={hx:Math.cos(e12)*L2,vy:Math.sin(e12)*L2};
  const eK={hx:Math.cos(e123)*LB,vy:Math.sin(e123)*LB};
  return { x:sh.x+(eB.hx+eS.hx+eK.hx)*cs,
           y:sh.y-(eB.vy+eS.vy+eK.vy),
           ex:sh.x+eB.hx*cs, ey:sh.y-eB.vy,
           mx:sh.x+(eB.hx+eS.hx)*cs, my:sh.y-(eB.vy+eS.vy),
           t,cs,sh };
}
const TIP=()=>arm3D();

/* ================= textures ================= */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));return PIXI.Texture.from(c);}
const TEX={
  sky:canvasTex(4,300,(c)=>{const g=c.createLinearGradient(0,0,0,300);
    g.addColorStop(0,'#4da3e8');g.addColorStop(.55,'#9fd0f5');g.addColorStop(1,'#e8f6ff');
    c.fillStyle=g;c.fillRect(0,0,4,300);}),
  ground:canvasTex(4,120,(c)=>{const g=c.createLinearGradient(0,0,0,120);
    g.addColorStop(0,'#b9a089');g.addColorStop(1,'#8f7355');c.fillStyle=g;c.fillRect(0,0,4,120);}),
  glow:canvasTex(128,128,(c)=>{const g=c.createRadialGradient(64,64,4,64,64,62);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g;c.fillRect(0,0,128,128);}),
  cloud:canvasTex(160,64,(c)=>{c.fillStyle='rgba(255,255,255,.95)';
    c.beginPath();c.ellipse(80,36,52,20,0,0,TAU);c.ellipse(114,42,34,15,0,0,TAU);c.ellipse(48,44,30,13,0,0,TAU);c.fill();}),
  dirt:canvasTex(24,24,(c)=>{c.fillStyle='#8a5a2b';c.beginPath();c.arc(12,12,10,0,TAU);c.fill();
    c.fillStyle='#6b4a28';c.beginPath();c.arc(8,10,4,0,TAU);c.fill();}),
};

/* ================= scene ================= */
const sceneBits={};
function layoutScene(){
  if(!sceneBits.sky){
    sceneBits.sky=new PIXI.Sprite(TEX.sky);
    sceneBits.glowSun=new PIXI.Sprite(TEX.glow);
    sceneBits.sun=new PIXI.Graphics();
    sceneBits.glowSun.anchor.set(.5);sceneBits.glowSun.alpha=.8;sceneBits.glowSun.tint=0xffe28a;
    sceneBits.sun.beginFill(0xffd166).lineStyle({width:4,color:0xf4a912}).drawCircle(0,0,30).endFill();
    layerBack.addChild(sceneBits.sky,sceneBits.glowSun,sceneBits.sun);
    sceneBits.clouds=[];
    for(let i=0;i<4;i++){
      const c=new PIXI.Sprite(TEX.cloud);c.anchor.set(.5);c.alpha=.92;c.s=.7+R()*.6;c.v=5+R()*7;c.x=R()*2000;c.y=50+R()*120;
      layerBack.addChild(c);sceneBits.clouds.push(c);
    }
    sceneBits.quarry=new PIXI.Graphics();
    layerBack.addChild(sceneBits.quarry);
    sceneBits.ground=new PIXI.Sprite(TEX.ground);
    sceneBits.grass=new PIXI.Graphics();
    layerMid.addChild(sceneBits.ground,sceneBits.grass);
    sceneBits.pile=new PIXI.Graphics();
    layerMid.addChild(sceneBits.pile);
    sceneBits.face=new PIXI.Graphics();
    layerMid.addChild(sceneBits.face);
    sceneBits.zone=new PIXI.Graphics();
    layerMid.addChild(sceneBits.zone);
    sceneBits.truck=new PIXI.Container();
    buildTruck(sceneBits.truck);
    layerMid.addChild(sceneBits.truck);
    sceneBits.rig=new PIXI.Container();
    buildRig(sceneBits.rig);
    layerFront.addChild(sceneBits.rig);
    sceneBits.marks=new PIXI.Graphics();
    layerFront.addChild(sceneBits.marks);
    sceneBits.dropTxt=new PIXI.Text('⬇ DROP',{fontFamily:'Comic Sans MS',fontSize:'20px',fontWeight:'900',fill:0x17395c});
    sceneBits.dropTxt.anchor.set(.5);sceneBits.dropTxt.visible=false;
    layerFront.addChild(sceneBits.dropTxt);
    sceneBits.arrow=new PIXI.Text('🚛 ◀ SWING',{fontFamily:'Comic Sans MS',fontSize:'22px',fontWeight:'900',fill:0xffffff});
    sceneBits.arrow.anchor.set(.5);sceneBits.arrow.visible=false;
    layerFront.addChild(sceneBits.arrow);
    sceneBits.parts=new PIXI.Container();
    layerFront.addChild(sceneBits.parts);
  }
  const b=sceneBits;
  b.sky.width=DW+40;b.sky.height=GY;
  b.sky.position.set(-20,0);
  b.glowSun.position.set(64,78);b.glowSun.width=b.glowSun.height=170;
  b.sun.position.set(64,78);
  b.quarry.clear();
  b.quarry.beginFill(0x9db3a4);
  b.quarry.moveTo(0,GY);
  for(let x=0;x<=DW+40;x+=30)b.quarry.lineTo(x,GY-118-28*Math.sin(x/70));
  b.quarry.lineTo(DW+40,GY);b.quarry.endFill();
  b.quarry.beginFill(0x8aa38f);
  for(let x=18;x<DW+40;x+=88)b.quarry.drawRect(x,GY-92,26,40);
  b.ground.width=DW+40;b.ground.position.set(-20,GY);
  b.grass.clear();b.grass.beginFill(0x6d8a3e);
  b.grass.moveTo(0,GY);for(let x=0;x<=DW+40;x+=30)b.grass.lineTo(x,GY-4-6*Math.abs(Math.sin(x/90)));
  b.grass.lineTo(DW+40,GY);b.grass.endFill();
}
function buildTruck(c){
  const g=new PIXI.Graphics();
  g.scale.x=-1;
  g.beginFill(0xe0a03c).lineStyle({width:3,color:0x17395c});
  g.moveTo(-78,-26);g.lineTo(6,-26);g.lineTo(20,-82);g.lineTo(20,-90);g.lineTo(-78,-90);g.closePath();
  g.endFill();
  g.beginFill(0x4ecdc4);
  g.moveTo(30,-26);g.lineTo(30,-92);g.lineTo(64,-92);g.lineTo(80,-56);g.lineTo(80,-26);g.closePath();g.endFill();
  g.lineStyle({width:3,color:0x17395c});
  g.moveTo(30,-26);g.lineTo(30,-92);g.lineTo(64,-92);g.lineTo(80,-56);g.lineTo(80,-26);g.closePath();
  g.beginFill(0xbfe6ff);g.moveTo(36,-32);g.lineTo(36,-84);g.lineTo(60,-84);g.lineTo(72,-56);g.lineTo(72,-32);g.closePath();g.endFill();
  g.beginFill(0xf2c9a0).drawCircle(48,-42,7).endFill();
  g.beginFill(0xc1121f).drawRect(42,-53,12,5).endFill();
  [[-52,-14,16],[42,-14,16]].forEach(([wx,wy,r])=>{
    g.beginFill(0x2b3440).drawCircle(wx,wy,r).endFill();
    g.beginFill(0x8a93a1).drawCircle(wx,wy,r*.42).endFill();
  });
  c.addChild(g);
}
function buildRig(c){
  c.tracks=new PIXI.Graphics();
  c.house=new PIXI.Container();
  const hg=new PIXI.Graphics();
  c.house.addChild(hg);
  c.houseG=hg;
  c.arm=new PIXI.Graphics();
  layerFront.addChild(c.arm);
  c.shadow=new PIXI.Graphics();
  c.addChild(c.shadow,c.tracks,c.house);
}
addEventListener('resize',()=>{relayout();});
relayout();

/* ================= levers (DOM) ================= */
const pointers={};
function leverEl(id){return document.querySelector(id==='swing'?'.hlever':'.lever[data-id="'+id+'"]');}
LV.forEach(l=>{l.el=leverEl(l.id);});
function bindVertical(l){
  const el=l.el,slot=el.querySelector('.slot'),knob=el.querySelector('.knob');
  function setFromY(clientY){
    const r=slot.getBoundingClientRect();
    l.v=clamp(-(clientY-(r.top+r.height/2))/(r.height/2-28),-1,1);
    l.active=true;el.classList.add('hold');
    knob.style.top=(50-l.v*32)+'%';
  }
  el.addEventListener('pointerdown',e=>{
    if(!S.started||S.paused||!l.enabled)return;
    audioInit();e.preventDefault();
    pointers[e.pointerId]=l;
    setFromY(e.clientY);
    try{el.setPointerCapture(e.pointerId);}catch(err){}
  });
  el.addEventListener('pointermove',e=>{if(pointers[e.pointerId]!==l)return;setFromY(e.clientY);});
  const end=e=>{if(pointers[e.pointerId]===l){l.active=false;el.classList.remove('hold');knob.style.top='50%';delete pointers[e.pointerId];}};
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}
LV.filter(l=>l.id!=='swing').forEach(bindVertical);
(function(){ // horizontal swing lever
  const l=LV.find(q=>q.id==='swing');
  const el=l.el,slot=el.querySelector('.hslot');
  function setFromX(clientX){
    const r=slot.getBoundingClientRect();
    l.v=clamp((clientX-(r.left+r.width/2))/(r.width/2-34),-1,1);
    l.active=true;el.classList.add('hold');
    slot.querySelector('.hknob').style.left=(50+l.v*34)+'%';
  }
  el.addEventListener('pointerdown',e=>{
    if(!S.started||S.paused||!l.enabled)return;
    audioInit();e.preventDefault();
    pointers[e.pointerId]=l;
    setFromX(e.clientX);
    try{el.setPointerCapture(e.pointerId);}catch(err){}
  });
  el.addEventListener('pointermove',e=>{if(pointers[e.pointerId]!==l)return;setFromX(e.clientX);});
  const end=e=>{if(pointers[e.pointerId]===l){l.active=false;el.classList.remove('hold');slot.querySelector('.hknob').style.left='50%';delete pointers[e.pointerId];}};
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
})();
function setLeverEnabled(id,on){
  const l=LV.find(q=>q.id===id);
  l.enabled=on;
  l.el.classList.toggle('locked',!on);
}

/* ================= audio ================= */
let AC=null,master=null,hissGain=null;
function audioInit(){
  if(!S.sound)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    const len=AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=R()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=850;f.Q.value=.7;
    hissGain=AC.createGain();hissGain.gain.value=0;
    src.connect(f);f.connect(hissGain);hissGain.connect(master);src.start();
  }catch(e){return null;}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,dur,type='sine',vol=.25,when=0,glide){
  const ac=audioInit();if(!ac)return;
  const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
const sDig=()=>tone(180,.2,'sawtooth',.14,0,90);
const sFull=()=>{tone(523,.12,'sine',.3);tone(784,.2,'sine',.3,.12);};
const sDump=()=>tone(120,.2,'square',.28,0,70);
const sHorn=()=>{tone(330,.18,'square',.25);tone(415,.32,'square',.25,.2);};
const sFan=()=>{tone(523,.14,'sine',.3);tone(659,.14,'sine',.3,.13);tone(784,.14,'sine',.3,.26);tone(1047,.4,'sine',.32,.4);};
const sChime=()=>{tone(784,.1,'sine',.3);tone(988,.18,'sine',.3,.1);};
const sClick=()=>tone(650,.06,'triangle',.22);

/* ================= tutorial ================= */
const TUT=[
  {ico:'↔️',txt:'Slide the <b>SWING</b> slider — watch the cab TURN!',lev:['swing'],
   check:()=>D.swing<-75||D.swing>25},
  {ico:'🎯',txt:'Now slide it <b>back to the middle</b> to face the sand wall',lev:['swing'],
   check:()=>Math.abs(D.swing+14)<40},
  {ico:'⬇️',txt:'Pull the <b>BOOM</b> lever DOWN to lower the arm',lev:['boom'],
   check:()=>D.e1<-6},
  {ico:'⬇️',txt:'Pull <b>STICK</b> DOWN to stretch out to the wall',lev:['stick'],
   check:()=>D.e2>52},
  {ico:'🥄',txt:'Hold <b>BUCKET</b> DOWN to SCOOP! (fill the yellow ring at the bucket)',lev:['boom','stick','buck'],
   check:()=>D.carry},
  {ico:'🚛',txt:'FULL! Slide <b>SWING ◀</b> all the way left to the truck!',lev:['swing'],
   check:()=>Math.min(Math.abs(D.swing-178),Math.abs(D.swing+180))<16},
  {ico:'⬆️',txt:'Fold the arm over the truck: <b>STICK ⬆</b> + <b>BOOM</b> up, then push <b>BUCKET ⬆</b> to DUMP!',lev:['boom','stick','buck','swing'],
   check:()=>S.loads>=1},
];
function startTutorial(){
  S.tutorial=true;S.need=1;S.loads=0;
  D.swing=-14;D.e1=30;D.e2=40;D.e3=10;D.fill=0;D.carry=false;   // reset the pose
  cols=[];for(let i=0;i<FACE.cols;i++)cols.push(FACE.base);
  zone={i:1,w:3};
  truck.x=DX()+TRUCK.off;truck.arriving=false;truck.leaving=false;
  LV.forEach(l=>setLeverEnabled(l.id,false));
  tutStep=-1;
  nextTut();
  $('timeTxt').textContent='—';
  updateUI();
}
function nextTut(){
  tutStep++;
  if(tutStep>=TUT.length){finishTutorial();return;}
  const st=TUT[tutStep];
  LV.forEach(l=>setLeverEnabled(l.id,st.lev.includes(l.id)));
  LV.forEach(l=>l.el.classList.toggle('glowt',st.lev.includes(l.id)));
  $('tutCard').style.display='block';
  $('tutIco').textContent=st.ico;
  $('tutTxt').innerHTML=st.txt;
  sChime();
}
function tutCheck(){
  if(!S.tutorial||S.paused||tutStep<0||tutStep>=TUT.length)return;
  if(TUT[tutStep].check()){
    sChime();
    sparkle(TIP().x,TIP().y);
    nextTut();
  }
}
function finishTutorial(){
  $('tutCard').style.display='none';
  LV.forEach(l=>{setLeverEnabled(l.id,true);l.el.classList.remove('glowt');});
  S.tutorial=false;
  graduating=true;                // graduation card when the practice truck departs
  S.loads=S.need;
  truckLeaves();
}
function truckLeaves(){
  truck.leaving=true;sHorn();sFan();
}

/* ================= game logic ================= */
function updateUI(){
  $('loadTxt').textContent=S.loads+' / '+S.need;
  $('lvlTxt').textContent=S.level;
  const dumpNow=overBedNow();
  $('chipDig').classList.toggle('on',!D.carry);
  $('chipSwing').classList.toggle('on',D.carry&&!dumpNow);
  $('chipDump').classList.toggle('on',dumpNow);
}
function overBedNow(){
  if(!D.carry)return false;
  const a=TIP();
  const miss=Math.min(Math.abs(D.swing-178),Math.abs(D.swing+180));
  return miss<20&&Math.abs(a.x-(DX()+TRUCK.bedOff))<62&&a.y<GY-70;
}
function digUpdate(dt){
  LV.forEach(l=>{
    if(!l.enabled){l.v=0;l.active=false;return;}
    if(!l.active)l.v=lerp(l.v,0,Math.min(1,12*dt));
  });
  const vb=LV[0].v,vs=LV[1].v,vk=LV[2].v,vw=LV[3].v;
  D.e1=clamp(D.e1+vb*RATE.boom*dt,-38,72);    // lever down → boom lowers
  D.e2=clamp(D.e2-vs*RATE.stick*dt,-10,92);   // lever down → stick reaches out
  D.e3=clamp(D.e3-vk*RATE.buck*dt,-32,122);   // lever down → bucket curls (scoop)
  D.swing=clamp(D.swing+vw*RATE.swing*dt,-186,58);
  const anyMove=Math.abs(vb)>.12||Math.abs(vs)>.12||Math.abs(vk)>.12||Math.abs(vw)>.12;
  if(hissGain)hissGain.gain.value=anyMove?.055:0;

  const a=TIP();
  const fw=(FACE.off-40)/FACE.cols;
  const zx=DX()+40+zone.i*fw, zw=zone.w*fw;
  const inZone=Math.abs(a.x-(zx+zw/2))<zw/2+16&&a.y>GY-FACE.base-6&&a.y<GY+20&&a.x>DX()+40;
  if(vk<-0.15&&inZone&&!D.carry){       // lever DOWN = scoop
    const bi=clamp(zone.i+Math.floor(R()*zone.w),0,FACE.cols-1);
    if(cols[bi]>30){
      cols[bi]=Math.max(30,cols[bi]-58*dt);
      pileH=Math.min(36,pileH+4*dt);
      if(R()<.8)dirt(a.x,a.y);
      if(R()<.09)sDig();
      D.fill+=dt*(S.tutorial?2.6:1.8);
      if(D.fill>=1){
        D.fill=1;D.carry=true;sFull();sparkle(a.x,a.y);
        if(!S.tutorial)moveZone();
        updateUI();
      }
    }
  }else if(!D.carry&&D.fill>0&&vk>0.1)D.fill=Math.max(0,D.fill-dt*2);   // lever UP = open/spill
  const miss=Math.min(Math.abs(D.swing-178),Math.abs(D.swing+180));
  const overBed=D.carry&&miss<20&&Math.abs(a.x-(DX()+TRUCK.bedOff))<62&&a.y<GY-70;
  // live coach: trying to dump from too far during the tutorial
  if(S.tutorial&&tutStep===6&&D.carry&&miss<24&&vk>0.12&&!overBed){
    $('tutTxt').innerHTML=a.y>=GY-70
      ?'Higher! Push <b>BOOM ⬆</b> up so the bucket is over the glowing bed!'
      :'Closer! Pull <b>STICK ⬆</b> in until the bucket is over the glowing bed!';
  }
  if(D.carry&&overBed&&vk>0.12){        // lever UP over the bed = dump
    D.carry=false;D.fill=0;
    S.loads++;sDump();dirt(a.x,a.y+16,9);
    updateUI();
    if(S.loads>=S.need&&!truck.leaving)truckLeaves();
  }
  updateUI();
}
function moveZone(){
  const w=zone.w, good=[];
  for(let i=0;i<=FACE.cols-w;i++){
    let sum=0;for(let k=0;k<w;k++)sum+=cols[i+k];
    if(sum>w*70)good.push(i);            // only fresh sand
  }
  if(!good.length){                       // wall spent → fresh sand slides down
    for(let i=0;i<FACE.cols;i++)cols[i]=FACE.base;
    sChime();
  }
  zone.i=good.length?good[Math.floor(R()*good.length)]:clamp(zone.i,0,FACE.cols-w);
}
function setupLevel(){
  cols=[];for(let i=0;i<FACE.cols;i++)cols.push(FACE.base);
  pileH=8;D.fill=0;D.carry=false;
  S.loads=0;S.need=6+(S.level-1)*2;S.time=0;S.par=80+S.need*16;
  zone={i:2+Math.floor(R()*3),w:2};
  truck.x=DX()+TRUCK.off;truck.arriving=true;truck.leaving=false;
  updateUI();
}
function truckUpdate(dt){
  if(truck.leaving){
    truck.x-=110*dt;
    if(R()<.15)parts.push({x:truck.x-62,y:GY-64,vx:-14,vy:-8,r:5,life:.8,type:'puff'});
    if(truck.x<DX()-620){
      truck.leaving=false;
      if(graduating){
        graduating=false;S.level=1;
        $('lvlTitle').textContent='🎓 YOU LEARNED IT!';
        $('starTxt').textContent='⭐⭐⭐';
        $('lvlText').innerHTML='Now a <b>REAL shift</b>: fill the whole truck!<br>1 DIG → 2 SWING → 3 DUMP. Go!';
      }else{
        starCount=S.time<=S.par?3:S.time<=S.par*1.45?2:1;
        $('lvlTitle').textContent='🚛 TRUCK LOADED!';
        $('starTxt').textContent='⭐'.repeat(starCount)+'☆'.repeat(3-starCount);
        $('lvlText').innerHTML='Time: <b>'+fmt(S.time)+'</b> (par '+fmt(S.par)+')<br>Next shift: <b>'+S.need+'</b> buckets!';
        S.level++;
      }
      $('lvlOv').classList.add('show');S.paused=true;
    }
  }else if(truck.arriving){
    truck.x+=110*dt;
    if(R()<.1)parts.push({x:truck.x-62,y:GY-64,vx:-14,vy:-8,r:5,life:.8,type:'puff'});
    if(truck.x>=DX()+TRUCK.off){truck.x=DX()+TRUCK.off;truck.arriving=false;}
  }
}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}
function dirt(x,y){parts.push({x,y,vx:(R()-.5)*140,vy:-40-R()*140,life:1,type:'dirt'});}
function sparkle(x,y){for(let i=0;i<12;i++)parts.push({x:x+(R()-.5)*50,y:y-R()*20,vx:(R()-.5)*40,vy:-50-R()*60,life:1,type:'star'});}
let partsPool=[];
function particles(dt){
  while(parts.length){
    const p=parts.pop();
    const s=partsPool.pop()||new PIXI.Sprite(TEX.dirt);
    if(p.type!=='dirt'){s.texture=PIXI.Texture.WHITE;s.tint=0xffd166;s.width=10;s.height=10;}
    else{s.texture=TEX.dirt;s.tint=0xffffff;s.width=p.r||10;s.height=p.r||10;}
    s.anchor.set(.5);s.x=p.x;s.y=p.y;s.alpha=1;s.vy=p.vy;s.vx=p.vx;s.life=p.life;s.type=p.type;
    sceneBits.parts.addChild(s);
  }
  sceneBits.parts.children.forEach(s=>{
    s.x+=(s.vx||0)*dt;s.y+=(s.vy||-20)*dt;s.vy=(s.vy||-20)+380*dt;
    if(s.y>GY+40){s.y=GY+40;s.vy*=-.3;s.vx*=.6;}
    s.life-=dt*.8;s.alpha=clamp(s.life,0,1);
    if(s.life<=0){sceneBits.parts.removeChild(s);partsPool.push(s);}
  });
}

/* ================= render ================= */
function render(dt){
  const b=sceneBits;
  b.clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>DW+160)c.x=-140;});
  b.face.clear();
  const fw=(FACE.off-40)/FACE.cols;
  for(let i=0;i<FACE.cols;i++){
    const h=cols[i],bx=DX()+40+i*fw;
    b.face.beginFill(0xd9b36c).drawRect(bx,GY-h,fw+1,h).endFill();
    b.face.beginFill(0xb28a4b,.75).drawRect(bx,GY-h*.5,fw+1,h*.28).endFill();
    if(h>FACE.base-4){b.face.beginFill(0x6d8a3e).drawRect(bx,GY-h-5,fw+1,7).endFill();}
  }
  const zx=DX()+40+zone.i*fw, zw=zone.w*fw;
  const pulse=.55+Math.sin(performance.now()/220)*.25;
  b.zone.clear();
  b.zone.beginFill(0xfff3b0,pulse*.45).drawRect(zx,GY-FACE.base-4,zw,FACE.base).endFill();
  b.zone.lineStyle({width:4,color:0xff9f1c}).drawRect(zx,GY-FACE.base-4,zw,FACE.base);
  if(!D.carry){
    b.zone.lineStyle({width:5,color:0xe63946});
    const s=11*(1+Math.sin(performance.now()/300)*.1);
    const mx=zx+zw/2,my=GY-30;
    b.zone.moveTo(mx-s,my-s);b.zone.lineTo(mx+s,my+s);
    b.zone.moveTo(mx+s,my-s);b.zone.lineTo(mx-s,my+s);
  }
  b.pile.clear();
  b.pile.beginFill(0xc49a58);
  b.pile.moveTo(DX()+34,GY+14);
  b.pile.quadraticCurveTo(DX()+120,GY+14-pileH,DX()+FACE.off-30,GY+14-pileH*.4);
  b.pile.lineTo(DX()+FACE.off-30,GY+16);b.pile.closePath();b.pile.endFill();
  b.truck.position.set(truck.x,GY);
  drawRigPixi();
  const a=TIP();
  b.marks.clear();
  const inZoneNow=!D.carry&&Math.abs(a.x-(zx+zw/2))<zw/2+16&&a.y>GY-FACE.base-6&&a.y<GY+20;
  const tipCol=D.carry?0x4da3e8:(inZoneNow?0x2fbf71:0xffffff);
  b.marks.lineStyle({width:3.5,color:tipCol}).drawCircle(a.x,a.y,16+Math.sin(performance.now()/200)*2);
  if(D.fill>0&&!D.carry){
    b.marks.lineStyle({width:5,color:0xffd166});
    b.marks.arc(a.x,a.y,26,-Math.PI/2,-Math.PI/2+TAU*D.fill);
  }
  const over=overBedNow();
  b.dropTxt.visible=over;
  if(over)b.dropTxt.position.set(DX()+TRUCK.bedOff,GY-120+Math.sin(performance.now()/200)*5);
  if(D.carry){
    b.arrow.visible=!over;
    if(!over)b.arrow.position.set(DX()+40,GY-215+Math.sin(performance.now()/250)*6);
    b.marks.lineStyle({width:4,color:0xffd166});
    b.marks.drawRoundedRect(DX()+TRUCK.bedOff-46,GY-92,92,64,10);
  }else b.arrow.visible=false;
  particles(dt);
}
function drawRigPixi(){
  const b=sceneBits,bg=b.rig;
  const a=TIP();
  const tr=bg.tracks;
  tr.clear();
  tr.beginFill(0x2b3440).lineStyle({width:3,color:0x17395c});
  tr.drawEllipse(DX(),GY-16,56,17);
  tr.endFill();
  tr.beginFill(0x5a6672);
  for(let i=0;i<6;i++){const tx=DX()-46+i*17+((performance.now()/60)%17);
    tr.drawRect(tx,GY-28,7,22);}
  tr.endFill();
  tr.lineStyle({width:5,color:0x5a6672}).drawEllipse(DX(),GY-32,34,10);
  bg.shadow.clear();
  bg.shadow.beginFill(0x17395c,.16).drawEllipse(DX()+8,GY+6,66,9).endFill();
  bg.shadow.beginFill(0x17395c,.12).drawEllipse(a.x,GY+8,24,5).endFill();
  const yaw=Math.cos(a.t);
  const h=bg.house;
  h.position.set(DX(),GY-34);
  h.scale.set(clamp(Math.abs(yaw),.4,1)*(yaw<0?-1:1),1);
  const hg=bg.houseG;
  hg.clear();
  hg.beginFill(0xf2a33c).lineStyle({width:3,color:0x17395c});
  hg.moveTo(-40,0);hg.lineTo(-46,-36);hg.lineTo(-30,-58);hg.lineTo(30,-58);hg.lineTo(44,-40);hg.lineTo(42,0);hg.closePath();
  hg.endFill();
  hg.beginFill(0x17395c).drawRoundedRect(-54,-30,14,22,4).endFill();
  hg.beginFill(0xff6b6b).lineStyle({width:3,color:0x17395c}).drawRoundedRect(-20,-54,42,24,6).endFill();
  hg.beginFill(0xbfe6ff).drawRoundedRect(-13,-49,30,15,4).endFill();
  hg.beginFill(0xfff3b0).drawCircle(24,-46,4).endFill();
  hg.beginFill(0x5a6672).drawRect(-34,-74,6,18).endFill();
  hg.beginFill(0xf2c9a0).drawCircle(4,-64,7).endFill();
  hg.beginFill(0xffd166).arc(4,-67,7.5,Math.PI,0).endFill();
  const g=bg.arm;
  g.clear();
  g.lineStyle({width:16,color:0xe08f2b,cap:PIXI.LINE_CAP.ROUND});
  g.moveTo(a.sh.x,a.sh.y);g.lineTo(a.ex,a.ey);
  g.lineStyle({width:2.5,color:0x17395c});
  g.moveTo(a.sh.x,a.sh.y);g.lineTo(a.ex,a.ey);
  g.lineStyle({width:7,color:0x8a93a1});
  g.moveTo(DX()-26,GY-40);g.lineTo((a.sh.x+a.ex)/2+10,(a.sh.y+a.ey)/2);
  g.lineStyle({width:3,color:0xd7dee5});
  g.moveTo(DX()-22,GY-38);g.lineTo((a.sh.x+a.ex)/2+10,(a.sh.y+a.ey)/2);
  g.lineStyle({width:13,color:0xf2a33c,cap:PIXI.LINE_CAP.ROUND});
  g.moveTo(a.ex,a.ey);g.lineTo(a.mx,a.my);
  g.lineStyle({width:2.2,color:0x17395c});
  g.moveTo(a.ex,a.ey);g.lineTo(a.mx,a.my);
  const dx2=a.x-a.mx,dy2=a.y-a.my;
  const nl=Math.hypot(dx2,dy2)||1;
  const ux=-dy2/nl,uy=dx2/nl;
  g.beginFill(0x8a93a1).lineStyle({width:2.5,color:0x17395c});
  g.moveTo(a.mx+ux*4,a.my+uy*4);
  g.lineTo(a.x+ux*16,a.y+uy*16);
  g.quadraticCurveTo(a.x+dx2*.28+ux*20,a.y+dy2*.28+uy*20,a.mx+dx2*.55-ux*2,a.my+dy2*.55-uy*2);
  g.lineTo(a.mx+dx2*.45,a.my+dy2*.45);
  g.closePath();g.endFill();
  g.lineStyle({width:2.5,color:0x5a6672});
  for(let i=1;i<=3;i++){
    const t0=i/4;
    g.moveTo(a.mx+dx2*t0+ux*10,a.my+dy2*t0+uy*10);
    g.lineTo(a.mx+dx2*(t0+.08)+ux*16,a.my+dy2*(t0+.08)+uy*16);
  }
  if(D.fill>0||D.carry){
    g.beginFill(0x8a5a2b);
    const lx=a.mx+dx2*.55,ly=a.my+dy2*.55;
    g.moveTo(a.mx+dx2*.2+ux*6,a.my+dy2*.2+uy*6);
    g.lineTo(lx+ux*10,ly+uy*10);
    g.lineTo(lx-ux*6,ly-uy*6);
    g.closePath();g.endFill();
  }
  g.beginFill(0x17395c).drawCircle(a.sh.x,a.sh.y,5).endFill();
  g.beginFill(0x17395c,.13).drawEllipse(a.x,GY+8,22,5).endFill();
}

/* ================= loop ================= */
let last=performance.now();
function frame(dt){
  if(!S.started||S.paused)return;
  if(!S.tutorial){S.time+=dt;$('timeTxt').textContent=fmt(S.time);}
  digUpdate(dt);
  truckUpdate(dt);
  tutCheck();
}
requestAnimationFrame(function tick(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;
  frame(dt);render(dt);
  requestAnimationFrame(tick);
});
setInterval(()=>{
  if(performance.now()-last>250){const now=performance.now();const dt=clamp((now-last)/1000,0,.05);last=now;
    frame(dt);render(dt);}
},80);

$('snd').addEventListener('click',()=>{
  S.sound=!S.sound;
  $('snd').textContent=S.sound?'🔊':'🔇';
  if(master)master.gain.value=S.sound?.5:0;
  if(S.sound)audioInit();
});

/* ================= test hooks ================= */
window.__ep={
  S,D,LV,truck,
  get cols(){return cols;},
  get zone(){return zone;},
  get tutStep(){return tutStep;},
  tip:()=>arm3D(),
  simulate(sec){const n=Math.max(1,Math.round(sec*60));for(let i=0;i<n;i++){frame(1/60);render(1/60);}},
  start(){document.getElementById('btnStart').click();},
  setLever(id,v){const l=LV.find(q=>q.id===id);if(l&&l.enabled){l.v=clamp(v,-1,1);l.active=true;}},
  release(){LV.forEach(l=>{l.active=false;});},
};
})();
